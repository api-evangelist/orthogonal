notes: >-
  Orthogonal's .well-known surface is split across three hosts and none of them
  serves the full set. api.orthogonal.com and mcp.orthogonal.com both publish RFC
  8414 OAuth 2.0 Authorization Server Metadata (issuer Clerk,
  clerk.orthogonal.com); mcp.orthogonal.com additionally publishes RFC 9728
  OAuth 2.0 Protected Resource Metadata. The agent-facing discovery documents —
  the A2A agent card and the published Agent Skill — live on the DOCS host
  (docs.orthogonal.com), which is where an agent is least likely to look; the
  apex and the API host both 404 for them. No security.txt, OpenID
  configuration, api-catalog or ai-plugin.json is published on any host.
