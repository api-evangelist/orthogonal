description: >-
  Per-operation price catalog derived from the x-payment-info extension carried on
  every payable operation in Orthogonal's marketplace OpenAPI. Orthogonal is a
  metered proxy: each third-party API operation it resells has a fixed USD price
  published in-band in the machine-readable contract, plus three settlement rails.
  This is the rare case of a provider publishing its unit economics as structured
  data inside its own OpenAPI rather than only on a pricing page.
