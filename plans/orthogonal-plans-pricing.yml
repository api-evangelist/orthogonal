description: >-
  Orthogonal sells no subscription. There are two published tiers for builders —
  a self-serve Free tier where all consumption is prepaid credits drawn down
  per call, and an unpriced Enterprise tier. The real price surface is not the
  plan table, it is the per-operation price catalog: every payable operation in
  the marketplace OpenAPI carries an x-payment-info block with a fixed USD price
  (see finops/orthogonal-finops.yml).
model: pay-per-call
currency: USD
plan_count: 2
