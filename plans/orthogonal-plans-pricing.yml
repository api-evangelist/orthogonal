- name: Free
  price: 0
  currency: USD
  period: month
  audience: builders
  self_serve: true
  included:
  - $10 in free credits to start
  - Access to all public APIs
  - Pay-per-request pricing
  - Auto top-up (beta)
  - Analytics
  overage: >-
    Not an overage model — credits are prepaid and drawn down per call at the
    per-operation price. Calls fail with 402 INSUFFICIENT_CREDITS when the
    balance cannot cover the quoted price.
  limits:
    rate_limits: undocumented (see rate-limits/orthogonal-rate-limits.yml)
    quota: none stated; bounded only by credit balance
