openapi: 3.2.0
info:
  title: Orthogonal API Marketplace Fundable API
  version: 1.0.0
  description: Discoverable APIs payable over MPP (Machine Payments Protocol / Tempo), x402, and np (Circle Gateway Nanopayments, x402 v2).
servers:
- url: https://mpp.orthogonal.com
  description: MPP (Tempo) rail
- url: https://x402.orthogonal.com
  description: x402 rail
- url: https://np.orthogonal.com
  description: np (Circle Gateway, x402 v2) rail
tags:
- name: Fundable
paths:
  /fundable/industry/search:
    get:
      operationId: fundable_GET__industry_search
      summary: Search for industry permalinks to filter by
      tags:
      - Fundable
      responses:
        '200':
          description: Successful response
  /fundable/location/search:
    get:
      operationId: fundable_GET__location_search
      summary: Search for location permalinks to filter by
      tags:
      - Fundable
      responses:
        '200':
          description: Successful response
  /fundable/company/deals:
    get:
      operationId: fundable_GET__company_deals
      summary: 'Get entire funding history for a company Pagination billing: call the first page normally and save billing.requestId from the Orthogonal /v1/run response. For later page, offset, or cursor calls on the same logical search, pass parentRequestId with unchanged non-pagination parameters. Valid continuation calls still get their own request IDs and quoted price, but are charged 0. Changing filters starts a new billable request.'
      tags:
      - Fundable
      responses:
        '200':
          description: Successful response
        '402':
          description: Payment Required (x402 / MPP / np)
      x-payment-info:
        price: dynamic
        offers:
        - method: mpp
          intent: charge
          rail: tempo
          currency: USDC.e
          url: https://mpp.orthogonal.com/fundable/company/deals
        - method: x402
          intent: charge
          rail: base
          currency: USDC
          url: https://x402.orthogonal.com/fundable/company/deals
        - method: np
          intent: charge
          rail: base
          currency: USDC
          settlement: circle-gateway
          version: x402-v2
          url: https://np.orthogonal.com/fundable/company/deals
  /fundable/deals/{id}:
    get:
      operationId: fundable_GET__deals_id_
      summary: Get funding round by id
      tags:
      - Fundable
      responses:
        '200':
          description: Successful response
        '402':
          description: Payment Required (x402 / MPP / np)
      x-payment-info:
        price: 0.066
        offers:
        - method: mpp
          intent: charge
          rail: tempo
          currency: USDC.e
          url: https://mpp.orthogonal.com/fundable/deals/{id}
        - method: x402
          intent: charge
          rail: base
          currency: USDC
          url: https://x402.orthogonal.com/fundable/deals/{id}
        - method: np
          intent: charge
          rail: base
          currency: USDC
          settlement: circle-gateway
          version: x402-v2
          url: https://np.orthogonal.com/fundable/deals/{id}
  /fundable/investor:
    get:
      operationId: fundable_GET__investor
      summary: Get investor by id
      tags:
      - Fundable
      responses:
        '200':
          description: Successful response
        '402':
          description: Payment Required (x402 / MPP / np)
      x-payment-info:
