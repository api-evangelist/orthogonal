          settlement: circle-gateway
          version: x402-v2
          url: https://np.orthogonal.com/fundable/investor
  /fundable/investor/search:
    get:
      operationId: fundable_GET__investor_search
      summary: Search for an investor id using fuzzy match or other identifiers
      tags:
      - Fundable
      responses:
        '200':
          description: Successful response
        '402':
          description: Payment Required (x402 / MPP / np)
      x-payment-info:
