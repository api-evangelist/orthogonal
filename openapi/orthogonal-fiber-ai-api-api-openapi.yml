openapi: 3.2.0
info:
  title: Orthogonal API Marketplace Fiber AI API
  version: 1.0.0
  description: Discoverable APIs payable over MPP (Machine Payments Protocol / Tempo), x402, and np (Circle Gateway Nanopayments, x402 v2).
servers:
- url: https://mpp.orthogonal.com
  description: MPP (Tempo) rail
- url: https://x402.orthogonal.com
  description: x402 rail
- url: https://np.orthogonal.com
  description: np (Circle Gateway, x402 v2) rail
tags:
- name: Fiber AI API
paths:
  /fiber/v1/contact-details/batch/start:
    post:
      operationId: fiber_POST__v1_contact_details_batch_start
      summary: Batch contact reveal for up to 2000 people. Async. Poll with /contact-details/batch/poll.
      tags:
      - Fiber AI API
      responses:
        '200':
          description: Successful response
        '402':
          description: Payment Required (x402 / MPP / np)
      x-payment-info:
        price: dynamic
        offers:
        - method: mpp
          intent: charge
          rail: tempo
          currency: USDC.e
          url: https://mpp.orthogonal.com/fiber/v1/contact-details/batch/start
        - method: x402
          intent: charge
          rail: base
          currency: USDC
          url: https://x402.orthogonal.com/fiber/v1/contact-details/batch/start
        - method: np
          intent: charge
          rail: base
          currency: USDC
          settlement: circle-gateway
          version: x402-v2
          url: https://np.orthogonal.com/fiber/v1/contact-details/batch/start
