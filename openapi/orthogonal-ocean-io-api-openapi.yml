        - method: np
          intent: charge
          rail: base
          currency: USDC
          settlement: circle-gateway
          version: x402-v2
          url: https://np.orthogonal.com/ocean-io/v2/enrich/company
  /ocean-io/v2/data-fields:
    get:
      operationId: ocean_io_GET__v2_data_fields
      summary: 'Returns all valid filter values for Ocean.io search endpoints: industries…'
      tags:
      - Ocean.io
      responses:
        '200':
          description: Successful response
  /ocean-io/v3/search/people:
    post:
      operationId: ocean_io_POST__v3_search_people
      summary: Search for people using filters (job title, seniority, department, skills…
      tags:
      - Ocean.io
      responses:
        '200':
          description: Successful response
        '402':
          description: Payment Required (x402 / MPP / np)
      x-payment-info:
        price: dynamic
        offers:
        - method: mpp
          intent: charge
          rail: tempo
          currency: USDC.e
          url: https://mpp.orthogonal.com/ocean-io/v3/search/people
        - method: x402
          intent: charge
          rail: base
          currency: USDC
          url: https://x402.orthogonal.com/ocean-io/v3/search/people
        - method: np
          intent: charge
          rail: base
          currency: USDC
          settlement: circle-gateway
          version: x402-v2
          url: https://np.orthogonal.com/ocean-io/v3/search/people
