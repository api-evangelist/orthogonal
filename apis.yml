aid: orthogonal
name: Orthogonal
description: >-
  Orthogonal is a unified API and payment layer for AI agents, backed by Pantera
  Capital and Y Combinator. An agent describes what it needs in natural language
  and Orthogonal returns the right service from a catalog of 40+ third-party APIs
  (web search, data enrichment, scraping, email finding/verification, identity),
  then proxies the call and meters a per-call price. Access is available through a
  REST API (api.orthogonal.com), a TypeScript SDK (@orth/sdk), a Python SDK (orth),
  a CLI (@orth/cli), and an official hosted MCP server (mcp.orthogonal.com) for
  Claude, Cursor, and other agents. Billing is prepaid credits or pay-per-call
  stablecoin micropayments over x402 (USDC on Base) and MPP (USDC.e on Tempo).
  Orthogonal also publishes an open library of 88 installable Agent Skills.
